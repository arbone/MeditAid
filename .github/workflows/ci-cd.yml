name: MeditAid CI/CD

on:
  push:
    branches:
      - main
      - feat/devops-master
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: meditaid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build and containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:3001
          VITE_SENTRY_DSN: ""
          VITE_APP_ENV: ci
        run: npm run build

      - name: Build frontend container
        run: docker build --target production -t meditaid-frontend:${{ github.sha }} .

      - name: Build backend container
        run: docker build -t meditaid-backend:${{ github.sha }} ./server

  deploy-preview:
    name: Deploy staging preview
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_ORG_ID: team_2bNmI0G2hFSnUeFiBPWySNwX
      VERCEL_PROJECT_ID: prj_ZIQdiP4Qe1nBY76VcfufBwMeAL8C

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@61.0.0

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --scope=arbone1s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build preview
        run: vercel build --scope=arbone1s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        run: vercel deploy --prebuilt --scope=arbone1s-projects --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_2bNmI0G2hFSnUeFiBPWySNwX
      VERCEL_PROJECT_ID: prj_ZIQdiP4Qe1nBY76VcfufBwMeAL8C

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@61.0.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --scope=arbone1s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production
        run: vercel build --prod --scope=arbone1s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --scope=arbone1s-projects --token=${{ secrets.VERCEL_TOKEN }}
