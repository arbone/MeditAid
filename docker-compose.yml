services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_APP_ENV: ${VITE_APP_ENV:-development}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./server
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
